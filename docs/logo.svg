      <stop offset="100%" stop-color="#d94e1f" />
    </linearGradient>
    <linearGradient id="diskGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#d94e1f" stop-opacity="0.85" />
