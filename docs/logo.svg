  <circle cx="32" cy="32" r="13.8" fill="none" stroke="url(#ringGrad)" stroke-width="2.2" />
  <circle cx="32" cy="32" r="11.2" fill="#04060c" />

  <g transform="rotate(-18 32 32)">
    <path d="M 8 32 A 24 5.8 0 0 0 56 32" fill="none" stroke="url(#diskGrad)" stroke-width="3.4" stroke-linecap="round" />
    <path d="M 11 32.6 A 21 5.0 0 0 0 53 32.6" fill="none" stroke="#fff6ea" stroke-width="1.1" stroke-linecap="round" opacity="0.85" />
