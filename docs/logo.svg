<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gargantua 3D Logo">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9d42" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#0b1020" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#060811" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffdcb0" />
